  <style>
    :root{color-scheme:light;--paper:#f4f4ef;--surface:#fff;--ink:#202b25;--muted:#788179;--line:#e4e7df;--green:#245b46;--green-deep:#1b4737;--green-soft:#e8f0e9;--red:#b64d45;--shadow:0 14px 38px rgba(32,43,37,.045)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.018em;padding-bottom:30px}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .shell{max-width:1080px;margin:0 auto;padding:24px 28px 48px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
    .brandmark{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;letter-spacing:-.05em}
    .brand-name{font-size:16px;font-weight:700;letter-spacing:-.045em}
    .brand-kicker{display:block;font-size:10px;line-height:1.2;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
    .today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
    .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}
    .intro h1{font-size:clamp(26px,4vw,36px);line-height:1.2;letter-spacing:-.055em;margin:0 0 7px;font-weight:650}
    .intro p{color:var(--muted);margin:0;font-size:14px}
    .date-tools{display:flex;align-items:center;gap:7px}
    .date-tools input{width:155px}
    .date-tools button{width:40px;height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--ink);font-size:17px}
    .date-tools button:hover{border-color:#aeb9aa}
    .overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(275px,.7fr);gap:14px;margin-bottom:25px;align-items:stretch}
    .balance{position:relative;overflow:hidden;background:var(--green-deep);color:#fff;border-radius:17px;min-height:208px;padding:23px 25px;display:flex;flex-direction:column;justify-content:space-between;transition:background-color .25s}
    .balance:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:-95px;top:-123px;box-shadow:0 0 0 25px rgba(255,255,255,.025),0 0 0 52px rgba(255,255,255,.02);pointer-events:none}
    .balance-label{font-size:13px;color:rgba(255,255,255,.75);position:relative;z-index:1}
    .balance-number{font-size:clamp(42px,6vw,58px);line-height:1.05;letter-spacing:-.065em;font-weight:600;font-variant-numeric:tabular-nums;margin-top:12px;position:relative;z-index:1}
    .balance-number small{font-size:14px;letter-spacing:0;font-weight:500;margin-left:6px;color:rgba(255,255,255,.75)}
    .balance-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;color:rgba(255,255,255,.78);font-size:12px;position:relative;z-index:1}
    .meter{height:5px;border-radius:9px;background:rgba(255,255,255,.19);overflow:hidden;margin-top:9px;position:relative;z-index:1}
    .meter i{display:block;width:0;height:100%;background:#fff;border-radius:inherit;transition:width .25s}
    .side-stack{display:grid;grid-template-rows:1fr 1fr;gap:12px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 19px;display:flex;flex-direction:column;justify-content:space-between;min-height:94px;box-shadow:var(--shadow)}
    .stat-label{color:var(--muted);font-size:12px}
    .stat strong{font-size:26px;font-weight:620;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin-top:8px}
    .stat strong small{font-size:11px;letter-spacing:0;color:var(--muted);font-weight:500;margin-left:4px}
    .entry-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 19px;box-shadow:var(--shadow);margin-bottom:22px}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:13px}
    .card h2,.entry-card h2{font-size:15px;margin:0;font-weight:650;letter-spacing:-.035em}
    .card-sub{font-size:12px;color:var(--muted);margin:4px 0 0}
    .bmr-fields{display:grid;grid-template-columns:minmax(130px,1fr) minmax(130px,1fr) auto;gap:9px;align-items:end}
    .field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none;transition:border-color .16s,box-shadow .16s}
    input,select{height:43px;padding:0 12px}
    textarea{padding:11px 12px;resize:vertical;min-height:82px;line-height:1.55}
    input:focus,textarea:focus,select:focus{border-color:#82a790;box-shadow:0 0 0 3px rgba(36,91,70,.09)}
    input::placeholder,textarea::placeholder{color:#a0a79f}
    .primary{border:0;border-radius:9px;background:var(--green);color:#fff;font-size:13px;font-weight:650;padding:11px 16px;min-height:43px;transition:background .16s}
    .primary:hover{background:#194b38}
    .soft-button{background:var(--green-soft);color:var(--green);border:0;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:650}
    details{border-top:1px solid var(--line);margin-top:13px;padding-top:11px}
    summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
    summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:17px;font-weight:400;color:var(--green)}details[open] summary:after{content:"−"}
    .calc-fields{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:end;margin-top:11px}
    .message{font-size:12px;min-height:18px;color:var(--green);margin:8px 0 0}.message.error{color:var(--red)}
    .tabbar{display:flex;gap:23px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto;scrollbar-width:none}
    .tabbar::-webkit-scrollbar{display:none}
    .tab{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:0 1px 12px;white-space:nowrap;font-size:13px;font-weight:600;margin-bottom:-1px}
    .tab svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .tab.active{color:var(--green);border-color:var(--green)}
    .panel{display:none}.panel.active{display:block}
    .content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 19px;box-shadow:var(--shadow)}
    .note-form{display:flex;flex-direction:column;gap:9px}
    .food-form-foot{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:9px}
    .records{min-height:68px}
    .empty{padding:18px 0;color:var(--muted);font-size:13px}
    .record{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
    .record:first-child{padding-top:0}.record:last-child{border-bottom:0;padding-bottom:0}
    .record-name{font-size:13px;font-weight:620;overflow-wrap:anywhere;white-space:pre-wrap}
    .record-note{color:var(--muted);font-size:11px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
    .record-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .record-kcal{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}.record-kcal small{color:var(--muted);font-weight:500;font-size:10px}
    .remove{border:0;background:transparent;color:#929a91;padding:5px;font-size:11px}.remove:hover{color:var(--red)}
    .history-head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:14px}
    .range-switch{display:flex;gap:5px;background:#f3f5f0;border-radius:9px;padding:3px}
    .range-switch button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:7px;font-size:12px;font-weight:600}
    .range-switch button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px rgba(32,43,37,.1)}
    .period-title{font-size:12px;color:var(--muted);margin:0 0 8px}
    .history-table{width:100%;border-collapse:collapse;font-size:13px}
    .history-table th,.history-table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
    .history-table th:first-child,.history-table td:first-child{text-align:left;padding-left:0}
    .history-table th:last-child,.history-table td:last-child{padding-right:0}
    .history-table th{color:var(--muted);font-size:11px;font-weight:600}
    .history-table tr:last-child td{border-bottom:0}
    .open-date{border:0;background:none;padding:0;color:var(--green);font-weight:620;text-decoration:underline;text-underline-offset:3px}
    .history-empty{padding:24px 0;color:var(--muted);font-size:13px}
    .footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:12px}
    .negative{color:var(--red)}.positive{color:var(--green)}
    @media(max-width:760px){.shell{padding:19px 18px 34px}.top{margin-bottom:29px}.intro{align-items:stretch;flex-direction:column}.overview{grid-template-columns:1fr}.balance{min-height:178px}.side-stack{grid-template-columns:1fr 1fr;grid-template-rows:auto}.content-grid{grid-template-columns:1fr}}
    @media(max-width:520px){body{padding-bottom:50px}.shell{padding:16px 15px 28px}.top{margin-bottom:24px}.brandmark{width:35px;height:35px}.intro h1{font-size:27px}.date-tools input{flex:1;width:auto}.date-tools button{width:39px}.balance{padding:20px;min-height:172px}.balance-number{font-size:46px}.side-stack{gap:8px}.stat{padding:13px 12px;min-height:82px}.stat strong{font-size:21px}.entry-card,.card{padding:16px}.bmr-fields{grid-template-columns:1fr 1fr}.bmr-fields .primary{grid-column:1/-1}.calc-fields{grid-template-columns:1fr 1fr}.calc-fields button{grid-column:1/-1}.food-form-foot{grid-template-columns:1fr}.tabbar{gap:18px}.history-table th,.history-table td{padding:10px 5px;font-size:11px}.history-table th{font-size:10px}.footer{display:block;line-height:1.8}.footer span{display:block}}
      .top{margin-bottom:40px}
    .overview{grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);margin-bottom:26px}
    .balance{min-height:190px;padding:22px 24px;border-radius:17px}
    .balance-number{font-size:clamp(38px,6vw,54px)}
    .side-stack{gap:14px}
    .stat{min-height:88px;padding:19px 18px}
    .stat strong{font-size:23px}
    .card{padding:19px 20px}
    .card-head{margin-bottom:15px}
    .card h2{font-size:15px}
    .card-sub{font-size:12px}
    .content-grid{grid-template-columns:minmax(0,1fr) minmax(280px,.75fr);gap:14px}
    .note-form{gap:8px}
    .note-form textarea{min-height:76px}
    .food-kcal-row{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;align-items:end}
    .food-kcal-row .primary{padding-left:13px;padding-right:13px}
    .record{padding:13px 0}
    @media(max-width:760px){.overview{grid-template-columns:1fr}.content-grid{grid-template-columns:1fr}}
    @media(max-width:520px){.top{margin-bottom:25px}.balance{min-height:164px;padding:20px}.balance-number{font-size:43px}.card{padding:17px 16px}.food-kcal-row{grid-template-columns:minmax(0,1fr) 90px}.food-kcal-row .primary{grid-column:1/-1}.note-form textarea{min-height:72px}}
      .top,.intro,.card-head,.balance-foot{min-width:0}
    .brand,.brand>span:last-child{min-width:0}
    .today{max-width:48%;min-width:0;text-align:right;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
    .intro h1{max-width:100%;overflow-wrap:anywhere}
    .balance-number{max-width:100%;overflow-wrap:anywhere}
    .balance-foot{flex-wrap:wrap}
    .balance-foot span{min-width:0;overflow-wrap:anywhere}
    @media(max-width:520px){.top{gap:10px;align-items:flex-start}.today{max-width:54%;font-size:12px}.intro h1{font-size:clamp(22px,7vw,27px)}.balance-foot{gap:5px 10px}}
      .date-tools #goToday{width:54px;min-width:54px;flex:0 0 54px;padding:0 5px;font-size:14px;line-height:1;letter-spacing:-.04em;white-space:nowrap}
      .record-sort{width:auto;min-width:120px;height:34px;padding:0 9px;font-size:12px}
      .history-scroll{overflow-x:auto}
    .history-table{min-width:680px}
    .history-meta{display:block;margin-top:2px;color:var(--muted);font-size:10px}
    .history-intake,.history-status{font-weight:650;white-space:nowrap}
    .food-names{display:block;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .record-head{align-items:flex-start}
    .record-disclosure{flex:1;min-width:0;border:0;margin:0;padding:0}
    .record-disclosure summary{color:var(--ink);font-size:15px;font-weight:650;padding:0}
    .record-disclosure[open] summary{margin-bottom:13px}
    .record-disclosure .records{min-height:0}
    /* Card entrance and scroll motion */
    html{overflow-x:hidden}
    .shell{overflow:hidden}
    @supports (overflow:clip){html{overflow-x:clip}.shell{overflow:clip;overflow-clip-margin:36px}}
    .motion-card{transform-origin:50% 50%;backface-visibility:hidden}
    .motion-awaiting{opacity:0}
    .motion-active{will-change:transform,opacity}
    @media(prefers-reduced-motion:reduce){
      .motion-card{opacity:1!important;transform:none!important;will-change:auto!important}
    }

  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#" aria-label="칼로리 노트 홈" data-i18n-aria-label="ui.home">
        <span class="brandmark">CN</span>
        <span><span class="brand-name" data-i18n="ui.name">칼로리 노트</span><span class="brand-kicker">DAILY LOG</span></span>
      </a>
      <time class="today" id="today"></time>
    </header>

    <section class="intro">
      <div><h1 id="pageTitle" data-i18n="ui.titleToday">오늘의 기초대사량</h1><p data-i18n="ui.intro">기초대사량을 날짜별로 기록하고 확인하세요.</p></div>
      <div class="date-tools" aria-label="날짜 선택" data-i18n-aria-label="ui.datePicker">
        <button type="button" id="prevDay" aria-label="이전 날짜" data-i18n-aria-label="ui.previousDate">‹</button>
        <input type="date" id="datePicker" aria-label="기록 날짜" data-i18n-aria-label="ui.recordDate">
        <button type="button" id="nextDay" aria-label="다음 날짜" data-i18n-aria-label="ui.nextDate">›</button>
        <button type="button" id="goToday" aria-label="오늘" data-i18n-aria-label="ui.today" data-i18n="ui.today">오늘</button>
      </div>
    </section>

    <section class="overview" aria-label="기초대사량 기록" data-i18n-aria-label="ui.bmrLog">
      <div class="balance" id="balance">
        <div>
          <div class="balance-label" data-i18n="ui.bmr">기초대사량</div>
          <div class="balance-number"><span id="heroBmr" data-i18n="ui.unrecorded">미기록</span><small>kcal</small></div>
        </div>
        <div>
          <div class="balance-foot"><span id="balanceCaption" data-i18n="ui.selectedBmr">선택한 날짜의 기초대사량</span><span id="mealRatio" data-i18n="ui.intakeZero">섭취 0 kcal</span></div>
          <div class="meter"><i id="mealMeter"></i></div>
        </div>
      </div>
      <div class="side-stack">
        <div class="stat"><span class="stat-label" data-i18n="ui.intakeToday">오늘 섭취 열량</span><strong id="foodTotal">0<small>kcal</small></strong></div>
        <div class="stat"><span class="stat-label" data-i18n="ui.bmrComparison">기초대사량 대비</span><strong id="difference">—</strong></div>
      </div>
    </section>

    <section class="entry-card">
      <div class="card-head"><div><h2 data-i18n="ui.bmrLog">기초대사량 기록</h2><p class="card-sub" data-i18n="ui.bmrLogHint">날짜별 수치와 체중을 저장합니다.</p></div></div>
      <div class="bmr-fields">
        <div class="field"><label for="bmrInput" data-i18n="ui.bmrPerDay">기초대사량 (kcal/일)</label><input id="bmrInput" type="number" min="500" max="5000" inputmode="numeric" placeholder="예: 1,500" data-i18n-placeholder="ui.bmrExample"></div>
        <div class="field"><label for="weightInput" data-i18n="ui.weight">체중 (kg)</label><input id="weightInput" type="number" min="20" max="300" step="0.1" inputmode="decimal" placeholder="예: 60" data-i18n-placeholder="ui.weightExample"></div>
        <button type="button" class="primary" id="saveBmr" data-i18n="ui.save">저장</button>
      </div>
      <p class="message" id="bmrMessage" aria-live="polite"></p>
      <details>
        <summary data-i18n="ui.bmrCalculator">기초대사량 계산</summary>
        <div class="calc-fields">
          <div class="field"><label for="sex" data-i18n="ui.sex">성별</label><select id="sex"><option value="m" data-i18n="ui.male">남성</option><option value="f" data-i18n="ui.female">여성</option></select></div>
          <div class="field"><label for="age" data-i18n="ui.age">나이</label><input id="age" type="number" min="15" max="100" placeholder="예: 30" data-i18n-placeholder="ui.ageExample"></div>
          <div class="field"><label for="height" data-i18n="ui.height">키 (cm)</label><input id="height" type="number" min="100" max="250" placeholder="예: 170" data-i18n-placeholder="ui.heightExample"></div>
          <button type="button" class="soft-button" id="calcBmr" data-i18n="ui.useEstimate">계산값 적용</button>
        </div>
      </details>
    </section>

    <nav class="tabbar" aria-label="기록 보기" data-i18n-aria-label="ui.recordTabs">
  <button type="button" class="tab active" data-tab="food" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7a4 4 0 0 0 4 4h1v9M7 2v5M11 2v5M16 22V2a5 5 0 0 1 5 5v4h-5"/></svg><span data-i18n="ui.meals">식사</span></button>
  <button type="button" class="tab" data-tab="ex"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6m16-6v6M2 10v4m20-4v4M8 7v10m8-10v10"/></svg><span data-i18n="ui.exercise">운동</span></button>
  <button type="button" class="tab" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M8 15l4-4 3 3 6-7"/><path d="M17 7h4v4"/></svg><span data-i18n="ui.history">기간별 기록</span></button>
</nav>

<section class="panel active" id="p-food">
  <div class="content-grid">
    <article class="card">
      <div class="card-head"><div><h2 data-i18n="ui.foodEaten">먹은 음식</h2><p class="card-sub" data-i18n="ui.foodHint">먹은 음식과 열량을 입력</p></div></div>
      <div class="note-form">
        <textarea id="foodText" rows="3" placeholder="먹은 음식과 양" data-i18n-placeholder="ui.foodPlaceholder"></textarea>
        <div class="food-kcal-row">
          <div class="field"><label for="foodKcal" data-i18n="ui.optionalCalories">열량 (선택)</label><input id="foodKcal" type="number" min="0" max="100000" inputmode="numeric" placeholder="kcal"></div>
          <button type="button" class="primary" id="addFood" data-i18n="ui.addRecord">기록 추가</button>
        </div>
        <p class="message" id="foodMessage" aria-live="polite"></p>
      </div>
    </article>
    <article class="card record-card">
      <div class="card-head record-head">
        <details class="record-disclosure" open>
          <summary><h2 data-i18n="ui.todayMeals">오늘 먹은 음식</h2></summary>
          <div class="records" id="foodList"></div>
        </details>
        <select id="foodSort" class="record-sort" aria-label="식사 기록 정렬" data-i18n-aria-label="ui.sortMeals"><option value="record" data-i18n="ui.addedOrder">기록 순</option><option value="high" data-i18n="ui.highCalories">열량 높은 순</option><option value="low" data-i18n="ui.lowCalories">열량 낮은 순</option></select>
      </div>
    </article>
  </div>
</section>

<section class="panel" id="p-ex">
  <div class="content-grid">
    <article class="card">
      <div class="card-head"><div><h2 data-i18n="ui.exerciseLog">운동 기록</h2><p class="card-sub" data-i18n="ui.exerciseHint">운동 내용을 자유롭게 입력</p></div></div>
      <div class="note-form">
        <textarea id="exerciseText" rows="3" placeholder="운동 내용, 시간, 세트" data-i18n-placeholder="ui.exercisePlaceholder"></textarea>
        <button type="button" class="primary" id="addExercise" data-i18n="ui.addRecord">기록 추가</button>
        <p class="message" id="exerciseMessage" aria-live="polite"></p>
      </div>
    </article>
    <article class="card record-card">
      <div class="card-head record-head">
        <details class="record-disclosure" open>
          <summary><h2 data-i18n="ui.todayExercise">오늘 운동</h2></summary>
          <div class="records" id="exerciseList"></div>
        </details>
      </div>
    </article>
  </div>
</section>

<section class="panel" id="p-history">
  <article class="card">
    <div class="history-head">
      <div><h2 data-i18n="ui.browseRecords">기록 모아보기</h2><p class="card-sub" data-i18n="ui.historyHint">선택한 날짜를 기준으로 확인</p></div>
      <div class="range-switch" role="group" aria-label="기간 선택" data-i18n-aria-label="ui.period">
        <button type="button" class="active" data-range="week" data-i18n="ui.week">1주일</button>
        <button type="button" data-range="month" data-i18n="ui.month">한달</button>
        <button type="button" data-range="year" data-i18n="ui.year">1년</button>
      </div>
    </div>
    <p class="period-title" id="periodTitle"></p>
    <div id="historyContent"></div>
  </article>
</section>
<footer class="footer"><span data-i18n="ui.localStorage">기록은 이 브라우저에 저장됩니다.</span><span data-i18n="ui.bmrReference">기초대사량 수치는 기록용 참고값입니다.</span></footer>
  </div>

  <script>
    applyUiLanguage();
const $ = id => document.getElementById(id);
    const localDateKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const todayKey = localDateKey(new Date());
    const todayDate = new Date();
    $('today').textContent = new Intl.DateTimeFormat(locale,{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(todayDate);
    let selectedDate = todayKey;
    let range = 'week';
    let foodSort = 'record';
    let S = loadDay(selectedDate);

    function readObject(key){
      try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { return {}; }
    }
    function cleanRows(rows){
      return (Array.isArray(rows) ? rows : []).map((x,i)=>({
        id: String(x && x.id || ('old-' + i + '-' + Math.random().toString(16).slice(2))),
        name: String(x && (x.name || x.text) || ''),
        sub: String(x && (x.sub || x.note) || ''),
        kcal: Math.max(0, Math.round(Number(x && x.kcal) || 0))
      })).filter(x=>x.name);
    }
    function loadDay(key){
      const raw = readObject('cal:' + key);
      const profile = readObject('cal:prof');
      const legacyUtc = new Date().toISOString().slice(0,10);
      let data = raw;
      if(key === todayKey && key !== legacyUtc && !localStorage.getItem('cal:' + key)){
        data = readObject('cal:' + legacyUtc);
      }
      return {
        bmr: Math.max(0, Number(data.bmr) || (key === todayKey ? Number(profile.bmr) || 0 : 0)),
        weight: Math.max(0, Number(data.weight) || Number(data.wt) || (key === todayKey ? Number(profile.wt) || 0 : 0)),
        food: cleanRows(data.food),
        ex: cleanRows(data.ex)
      };
    }
    function saveDay(){
      try{
        localStorage.setItem('cal:' + selectedDate, JSON.stringify({bmr:S.bmr,weight:S.weight,wt:S.weight,food:S.food,ex:S.ex}));
        if(selectedDate === todayKey) localStorage.setItem('cal:prof', JSON.stringify({bmr:S.bmr,wt:S.weight}));
      }catch(e){}
    }
    const makeId = () => window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    const fmt = v => Math.round(Number(v)||0).toLocaleString(locale);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateLabel = key => {
      const p=key.split('-').map(Number);
      return new Intl.DateTimeFormat(locale,{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(p[0],p[1]-1,p[2]));
    };
    const dayCount = count => t(count===1?'dyn.dayCountOne':'dyn.dayCountMany',{count:fmt(count)});
    const periodDate = date => locale==='ko-KR'?localDateKey(date):new Intl.DateTimeFormat(locale,{year:'numeric',month:'short',day:'numeric'}).format(date);
    const allRows = () => S.food.concat(S.ex);
    const foodKcal = rows => rows.reduce((sum,x)=>sum + (Number(x.kcal)||0),0);

    function sortedFood(){
      const indexed=S.food.map((item,index)=>({item,index}));
      if(foodSort==='record')return S.food;
      return indexed.sort((a,b)=>{
        const ak=Number(a.item.kcal)||0,bk=Number(b.item.kcal)||0;
        if(!ak&&bk)return 1;
        if(!bk&&ak)return -1;
        return (foodSort==='high'?bk-ak:ak-bk)||a.index-b.index;
      }).map(row=>row.item);
    }
    function setTab(tab){
      document.querySelectorAll('.tab').forEach(b=>{
        const active=b.dataset.tab===tab;
        b.classList.toggle('active',active);
        if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
      });
      ['food','ex','history'].forEach(x=>$('p-'+x).classList.toggle('active',x===tab));
      if(tab==='history') renderHistory();
    }
    function listHtml(items,kind){
      if(!items.length)return '<div class="empty">'+esc(t('dyn.empty'))+'</div>';
      return items.map(x=>'<div class="record"><div><div class="record-name">'+esc(x.name)+'</div>'+(x.sub?'<div class="record-note">'+esc(x.sub)+'</div>':'')+'</div><div class="record-right">'+(x.kcal?'<span class="record-kcal">'+fmt(x.kcal)+' <small>kcal</small></span>':'')+'<button type="button" class="remove" data-kind="'+kind+'" data-id="'+esc(x.id)+'" aria-label="'+esc(t('dyn.deleteRecord'))+'">'+esc(t('dyn.delete'))+'</button></div></div>').join('');
    }
    function updateHeat(kcal,bmr){
      const ratio=bmr>0?kcal/bmr:0;
      const over=Math.max(0,kcal-bmr);
      const level=bmr>0?Math.max(0,Math.min(1,over/Math.max(150,bmr*.5))):0;
      const hue=over>0?0:145;
      const saturation=over>0?Math.round(58+22*level):42;
      const lightness=over>0?Math.round(42-9*level):29;
      $('balance').style.backgroundColor='hsl('+hue+' '+saturation+'% '+lightness+'%)';
      $('mealMeter').style.width=Math.max(0,Math.min(100,ratio*100))+'%';
      $('mealMeter').style.backgroundColor=over>0?'hsl(0 '+Math.round(65+20*level)+'% 76%)':'hsl(145 55% 76%)';
    }
    function render(){
      const b=Number(S.bmr)||0, k=foodKcal(S.food);
      $('datePicker').value=selectedDate;
      $('pageTitle').textContent=selectedDate===todayKey?t('dyn.todayBmr'):t('dyn.dateBmr',{date:dateLabel(selectedDate)});
      $('bmrInput').value=b||'';
      $('weightInput').value=S.weight||'';
      $('heroBmr').textContent=b?fmt(b):t('dyn.notRecorded');
      $('balanceCaption').textContent=b?t('dyn.compareIntake'):t('dyn.enterBmr');
      $('mealRatio').textContent=t('dyn.intakeAmount',{value:fmt(k)});
      $('foodTotal').innerHTML=fmt(k)+'<small>kcal</small>';
      const diff=b-k;
      $('difference').innerHTML=b?(diff>=0?fmt(diff)+'<small>'+esc(t('dyn.remainingSuffix'))+'</small>':'<span class="negative">'+fmt(Math.abs(diff))+'<small>'+esc(t('dyn.overSuffix'))+'</small></span>'):esc(t('dyn.notRecorded'));
      $('foodList').innerHTML=listHtml(sortedFood(),'food');
      $('exerciseList').innerHTML=listHtml(S.ex,'ex');
      $('today').textContent=new Intl.DateTimeFormat(locale,{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(todayDate);
      updateHeat(k,b);
      document.querySelectorAll('[data-range]').forEach(btn=>btn.classList.toggle('active',btn.dataset.range===range));
      if($('p-history').classList.contains('active'))renderHistory();
    }
    function addNote(kind){
      const isFood=kind==='food';
      const box=$(isFood?'foodText':'exerciseText');
      const msg=$(isFood?'foodMessage':'exerciseMessage');
      const raw=box.value.trim();
      if(!raw){msg.textContent=t('dyn.enterContent');msg.classList.add('error');return;}
      const amount=isFood?Math.max(0,Math.round(Number($('foodKcal').value)||0)):0;
      S[isFood?'food':'ex'].push({id:makeId(),name:raw,sub:'',kcal:amount});
      box.value='';
      if(isFood)$('foodKcal').value='';
      msg.textContent=isFood?t('dyn.foodAdded'):t('dyn.exerciseAdded');
      msg.classList.remove('error');
      saveDay();
      render();
    }
    function saveBmr(){
      S.bmr=Math.max(0,Math.min(5000,Math.round(Number($('bmrInput').value)||0)));
      S.weight=Math.max(0,Math.min(300,Number($('weightInput').value)||0));
      saveDay();
      $('bmrMessage').textContent=S.bmr?t('dyn.bmrSaved'):t('dyn.bmrCleared');
      $('bmrMessage').classList.remove('error');
      render();
    }
    function dayInfo(key){
      const d=loadDay(key);
      const foods=d.food.filter(x=>x.name);
      const calorieLogged=foods.some(x=>(Number(x.kcal)||0)>0);
      return {key:key,bmr:d.bmr,weight:d.weight,food:foodKcal(foods),foods:foods.map(x=>x.name),foodCount:foods.length,calorieLogged:calorieLogged,exerciseCount:d.ex.length,has:!!(d.bmr||d.weight||foods.length||d.ex.length)};
    }
    function excessPresentation(over,baseline,known){
      if(!baseline)return {label:t('dyn.bmrMissing'),color:'var(--muted)',background:'transparent',level:0};
      if(!known)return {label:t('dyn.caloriesMissing'),color:'var(--muted)',background:'transparent',level:0};
      if(over<=0)return {label:t('dyn.noExcess'),color:'var(--green)',background:'rgba(36,91,70,.055)',level:0};
      const level=Math.max(0,Math.min(1,over/Math.max(150,baseline*.5)));
      const color='hsl(0 '+Math.round(58+22*level)+'% '+Math.round(42-9*level)+'%)';
      const background='rgba(182,77,69,'+(0.055+level*.14).toFixed(3)+')';
      return {label:t('dyn.excessAmount',{value:fmt(over)}),color:color,background:background,level:level};
    }
    function historyTable(rows,yearMode){
      if(!rows.length)return '<div class="history-empty">'+esc(t('dyn.historyEmpty'))+'</div>';
      if(yearMode){
        return '<div class="history-scroll"><table class="history-table"><thead><tr><th>'+esc(t('dyn.month'))+'</th><th>'+esc(t('dyn.recordedDays'))+'</th><th>'+esc(t('dyn.averageBmr'))+'</th><th>'+esc(t('dyn.intakeCalories'))+'</th><th>'+esc(t('dyn.excessCalories'))+'</th></tr></thead><tbody>'+rows.map(m=>{
          const status=excessPresentation(m.over,m.base,m.calorieDays>0);
          const rowStyle=status.background==='transparent'?'':' style="background-color:'+status.background+'"';
          const overLabel=status.label+(m.overDays?' · '+dayCount(m.overDays):'');
          return '<tr'+rowStyle+'><td><button type="button" class="open-date" data-open="'+m.open+'">'+m.label+'</button></td><td>'+esc(dayCount(m.days))+'</td><td>'+(m.avg?fmt(m.avg)+' kcal':'—')+'</td><td><span class="history-intake" style="color:'+status.color+'">'+(m.calorieDays?fmt(m.food)+' kcal':esc(t('dyn.notEntered')))+'</span></td><td><span class="history-status" style="color:'+status.color+'">'+overLabel+'</span></td></tr>';
        }).join('')+'</tbody></table></div>';
      }
      return '<div class="history-scroll"><table class="history-table"><thead><tr><th>'+esc(t('dyn.date'))+'</th><th>'+esc(t('dyn.bmrWeight'))+'</th><th>'+esc(t('dyn.intakeCalories'))+'</th><th>'+esc(t('dyn.excessCalories'))+'</th><th>'+esc(t('dyn.foods'))+'</th></tr></thead><tbody>'+rows.map(d=>{
        const status=excessPresentation(d.food-d.bmr,d.bmr,d.calorieLogged);
        const rowStyle=status.background==='transparent'?'':' style="background-color:'+status.background+'"';
        const foodNames=d.foods.length?d.foods.slice(0,2).map(esc).join(', ')+(d.foods.length>2?esc(t('dyn.moreFoods',{count:fmt(d.foods.length-2)})):''):'—';
        const bmrText=d.bmr?fmt(d.bmr)+' kcal':'—';
        const weightText=d.weight?'<span class="history-meta">'+Number(d.weight).toLocaleString(locale)+' kg</span>':'';
        return '<tr'+rowStyle+'><td><button type="button" class="open-date" data-open="'+d.key+'">'+dateLabel(d.key)+'</button></td><td><span>'+bmrText+'</span>'+weightText+'</td><td><span class="history-intake" style="color:'+(d.calorieLogged?status.color:'var(--muted)')+'">'+(d.calorieLogged?fmt(d.food)+' kcal':esc(t('dyn.notEntered')))+'</span></td><td><span class="history-status" style="color:'+status.color+'">'+status.label+'</span></td><td><span class="food-names" title="'+esc(d.foods.join(', '))+'">'+foodNames+'</span></td></tr>';
      }).join('')+'</tbody></table></div>';
    }
    function renderHistory(){
      const selected=new Date(Number(selectedDate.slice(0,4)),Number(selectedDate.slice(5,7))-1,Number(selectedDate.slice(8,10)));
      let rows=[],title='',yearMode=false;
      if(range==='year'){
        const year=selected.getFullYear();title=new Intl.DateTimeFormat(locale,{year:'numeric'}).format(selected);
        for(let month=0;month<12;month++){
          const days=[];
          const count=new Date(year,month+1,0).getDate();
          for(let day=1;day<=count;day++){
            const info=dayInfo(localDateKey(new Date(year,month,day)));
            if(info.has)days.push(info);
          }
          if(days.length){
            const bmrDays=days.filter(d=>d.bmr);
            const calorieDays=days.filter(d=>d.calorieLogged);
            const comparable=days.filter(d=>d.calorieLogged&&d.bmr);
            const overDays=comparable.filter(d=>d.food>d.bmr).length;
            const over=comparable.reduce((s,d)=>s+Math.max(0,d.food-d.bmr),0);
            const base=comparable.reduce((s,d)=>s+d.bmr,0);
            rows.push({label:new Intl.DateTimeFormat(locale,{month:'long'}).format(new Date(year,month,1)),open:localDateKey(new Date(year,month+1,0)),days:days.length,avg:bmrDays.length?Math.round(bmrDays.reduce((s,d)=>s+d.bmr,0)/bmrDays.length):0,food:calorieDays.reduce((s,d)=>s+d.food,0),calorieDays:calorieDays.length,base:base,over:over,overDays:overDays});
          }
        }
        yearMode=true;
      }else{
        let start,end;
        if(range==='week'){
          end=selected;
          start=new Date(selected);start.setDate(start.getDate()-6);
          title=t('dyn.dateRange',{start:periodDate(start),end:periodDate(end)});
        }else{
          start=new Date(selected.getFullYear(),selected.getMonth(),1);
          end=new Date(selected.getFullYear(),selected.getMonth()+1,0);
          title=new Intl.DateTimeFormat(locale,{year:'numeric',month:'long'}).format(selected);
        }
        for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
          const info=dayInfo(localDateKey(d));
          if(info.has)rows.push(info);
        }
      }
      $('periodTitle').textContent=title;
      $('historyContent').innerHTML=historyTable(rows,yearMode);
    }

    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
    document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{range=b.dataset.range;renderHistory();document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));}));
    $('saveBmr').addEventListener('click',saveBmr);
    $('calcBmr').addEventListener('click',()=>{
      const age=Number($('age').value),height=Number($('height').value),weight=Number($('weightInput').value);
      const msg=$('bmrMessage');
      if(age<15||age>100||height<100||height>250||weight<20||weight>300){
        msg.textContent=t('dyn.checkMeasurements');
        msg.classList.add('error');
        return;
      }
      $('bmrInput').value=Math.round(10*weight+6.25*height-5*age+($('sex').value==='m'?5:-161));
      msg.textContent=t('dyn.calculationApplied');
      msg.classList.remove('error');
    });
    $('foodSort').addEventListener('change',e=>{foodSort=e.target.value;render();});
$('addFood').addEventListener('click',()=>addNote('food'));
    $('addExercise').addEventListener('click',()=>addNote('ex'));
    $('foodText').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')addNote('food');});
    $('exerciseText').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')addNote('ex');});
    document.addEventListener('click',e=>{
      const remove=e.target.closest('[data-kind][data-id]');
      if(remove){
        const key=remove.dataset.kind==='food'?'food':'ex';
        S[key]=S[key].filter(x=>String(x.id)!==remove.dataset.id);
        saveDay();render();return;
      }
      const open=e.target.closest('[data-open]');
      if(open){
        saveDay();
        selectedDate=open.dataset.open;
        S=loadDay(selectedDate);
        range='month';
        render();
        setTab('history');
      }
    });
    function changeDate(key){
      if(!key)return;
      saveDay();
      selectedDate=key;
      S=loadDay(selectedDate);
      $('bmrMessage').textContent='';
      $('foodMessage').textContent='';
      $('exerciseMessage').textContent='';
      render();
    }
    $('datePicker').addEventListener('change',e=>changeDate(e.target.value));
    $('prevDay').addEventListener('click',()=>{const d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()-1);changeDate(localDateKey(d));});
    $('nextDay').addEventListener('click',()=>{const d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+1);changeDate(localDateKey(d));});
    $('goToday').addEventListener('click',()=>changeDate(todayKey));
    render();
    // Independent surface motion; daily records and layout stay in their own code.
    (() => {
      if(!Element.prototype.animate || !window.IntersectionObserver)return;
      const preference=window.matchMedia('(prefers-reduced-motion: reduce)');
      const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
      const random=(min,max)=>min+Math.random()*(max-min);
      const motionSpeed=.75;
      const maxSwing=1.15;
      const directions=[0,1,2,3];
      for(let i=directions.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [directions[i],directions[j]]=[directions[j],directions[i]];
      }
      const states=Array.from(document.querySelectorAll('.balance,.stat,.entry-card,.card')).map(card=>{
        card.classList.add('motion-card');
        const anchor=Math.random()<.5?0:100;
        card.style.transformOrigin=anchor+'% 0%';
        return {
          card,anchor,entered:false,entering:false,animation:null,r:0,vr:0,
          phase:random(0,Math.PI*2),
          stiffnessR:random(.008,.014),dampingR:random(.936,.95),
          gainR:random(.008,.013)*(anchor===0?1:-1)
        };
      });
      const byCard=new Map(states.map(state=>[state.card,state]));
      let arrival=0,frame=0,lastFrame=0,pending=0,lastScroll=window.scrollY;
      let lastEvent=-Infinity,lastDirection=0,newGesture=false;

      function resetSpring(state){
        state.r=state.vr=0;
        state.card.style.transform='';
        if(!state.entering)state.card.classList.remove('motion-active');
      }
      function finishEntrance(state){
        const animation=state.animation;
        state.animation=null;
        state.entering=false;
        state.card.classList.remove('motion-awaiting','motion-active');
        if(animation)animation.cancel();
        resetSpring(state);
        state.card.style.transformOrigin=state.anchor+'% 0%';
      }
      function startEntrance(state){
        if(state.entered || preference.matches || document.hidden)return;
        const box=state.card.getBoundingClientRect();
        if(!box.width || !box.height)return;
        state.entered=true;
        state.entering=true;
        state.card.style.transformOrigin='50% 50%';
        observer.unobserve(state.card);
        const order=arrival++,direction=directions[order%directions.length];
        const width=window.innerWidth,height=window.innerHeight,pad=random(70,150);
        let x=0,y=0;
        if(direction===0){x=-(box.right+pad);y=random(-height*.55,height*.55);}
        if(direction===1){x=width-box.left+pad;y=random(-height*.55,height*.55);}
        if(direction===2){x=random(-width*.5,width*.5);y=-(box.bottom+pad);}
        if(direction===3){x=random(-width*.5,width*.5);y=height-box.top+pad;}
        const turn=random(10,22)*(Math.random()<.5?-1:1);
        const settleX=-Math.sign(x)*random(5,9),settleY=-Math.sign(y)*random(4,7);
        const transform=(dx,dy,angle,scale)=>'translate3d('+dx+'px,'+dy+'px,0) rotate('+angle+'deg) scale('+scale+')';
        state.card.classList.remove('motion-awaiting');
        state.card.classList.add('motion-active');
        try{
          const animation=state.card.animate([
            {transform:transform(x,y,turn,.84),opacity:0,offset:0,easing:'cubic-bezier(.16,.82,.22,1)'},
            {opacity:1,offset:.24},
            {transform:transform(settleX,settleY,-turn*.045,1.012),opacity:1,offset:.74,easing:'cubic-bezier(.4,0,.2,1)'},
            {transform:transform(-settleX*.3,-settleY*.3,turn*.018,.998),offset:.89,easing:'ease-out'},
            {transform:transform(0,0,0,1),opacity:1,offset:1}
          ],{duration:random(1060,1360),delay:(order%6)*48+random(0,45),fill:'both'});
          state.animation=animation;
          animation.finished.then(()=>{
            if(state.animation===animation)finishEntrance(state);
          },()=>{
            if(state.animation===animation)finishEntrance(state);
          });
        }catch(e){finishEntrance(state);}
      }
      const observer=new IntersectionObserver(entries=>{
        for(const entry of entries)if(entry.isIntersecting)startEntrance(byCard.get(entry.target));
      },{rootMargin:'0px 0px 70px 0px',threshold:.01});

      function tick(now){
        frame=0;
        const step=(lastFrame?clamp((now-lastFrame)/16.667,.5,2):1)*motionSpeed;
        lastFrame=now;
        const impulse=pending;
        pending=0;
        const refreshProfile=newGesture;
        newGesture=false;
        let moving=false;
        for(const state of states){
          if(!state.entered || state.entering)continue;
          const box=state.card.getBoundingClientRect();
          if(!box.width || box.bottom<0 || box.top>window.innerHeight || state.card.contains(document.activeElement)){
            resetSpring(state);
            continue;
          }
          if(refreshProfile){
            state.gainR=random(.008,.013)*(state.anchor===0?1:-1);
          }
          if(Math.abs(impulse)>.1){
            const variation=.75+.25*Math.sin(window.scrollY/160+state.phase);
            const energy=Math.hypot(state.r,state.vr/Math.sqrt(state.stiffnessR));
            // Add momentum near the middle, then let the corner swing freely.
            // Repeated scrolling must not hold the card at its outer angle.
            if(refreshProfile || energy<.2 || Math.abs(state.r)<.25){
              const velocityLimit=Math.min(.22,Math.sqrt(state.stiffnessR*Math.max(0,maxSwing*maxSwing-state.r*state.r)));
              state.vr=clamp(state.vr+impulse*state.gainR*variation,-velocityLimit,velocityLimit);
            }
          }
          state.vr=(state.vr-state.r*state.stiffnessR*step)*Math.pow(state.dampingR,step);
          state.r+=state.vr*step;
          const energy=Math.hypot(state.r,state.vr/Math.sqrt(state.stiffnessR));
          if(energy>.018){
            // A single fixed corner: the opposite edge swings in a wide, slow arc.
            const radius=Math.hypot(state.card.offsetWidth,state.card.offsetHeight);
            const angleLimit=Math.min(2.9,1620/Math.max(1,radius));
            const angle=angleLimit*state.r/maxSwing;
            state.card.style.transform='rotate('+angle.toFixed(3)+'deg)';
            state.card.classList.add('motion-active');
            moving=true;
          }else resetSpring(state);
        }
        if(moving || Math.abs(pending)>.1)frame=requestAnimationFrame(tick);
        else lastFrame=0;
      }
      function stopMotion(revealAll){
        if(frame)cancelAnimationFrame(frame);
        frame=lastFrame=pending=0;
        newGesture=false;lastEvent=-Infinity;lastDirection=0;
        for(const state of states){
          if(revealAll)state.entered=true;
          if(state.entering || revealAll)finishEntrance(state);
          else resetSpring(state);
        }
      }
      window.addEventListener('scroll',()=>{
        const delta=window.scrollY-lastScroll;
        lastScroll=window.scrollY;
        if(preference.matches || document.hidden || Math.abs(delta)<.1)return;
        const now=performance.now(),direction=Math.sign(delta);
        if(now-lastEvent>160 || (Math.abs(delta)>1 && direction!==lastDirection))newGesture=true;
        lastEvent=now;
        if(Math.abs(delta)>1)lastDirection=direction;
        pending=clamp(pending+delta,-90,90);
        if(!frame)frame=requestAnimationFrame(tick);
      },{passive:true});
      document.addEventListener('focusin',event=>{
        const card=event.target.closest && event.target.closest('.motion-card');
        const state=byCard.get(card);
        if(!state)return;
        state.entered=true;
        observer.unobserve(card);
        finishEntrance(state);
      });
      document.addEventListener('visibilitychange',()=>{
        lastScroll=window.scrollY;
        if(document.hidden)stopMotion(false);
        else for(const state of states){
          const box=state.card.getBoundingClientRect();
          if(box.top<window.innerHeight+70 && box.bottom>0)startEntrance(state);
        }
      });
      preference.addEventListener('change',()=>{
        lastScroll=window.scrollY;
        if(preference.matches){observer.disconnect();stopMotion(true);}
      });
      window.addEventListener('pagehide',()=>{observer.disconnect();stopMotion(true);});
      if(preference.matches)stopMotion(true);
      else for(const state of states){
        state.card.classList.add('motion-awaiting');
        observer.observe(state.card);
      }
    })();

  </script>
</body>
</html>
